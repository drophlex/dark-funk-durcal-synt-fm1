name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "release v1.8.2-dfd6 (the .fwsc and the installer)"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=v1.8.2-dfd6
          gh release view $T >/dev/null 2>&1 || gh release create $T --target main --latest \
            --title "Dark Funk Durcal Synt 1.8.2-dfd6 (v2: LIVE, NEXT, SMEAR eye)" \
            --notes "Firmware for the M-VAVE FM-1, identity FM-1_946. Easiest: open DarkFunkDurcal-Installer.html in Chrome or Edge with the FM-1 on USB and press Install. Manuals (EN+ES): manual/. Web groovebox: https://drophlex.github.io/dark-funk-durcal-synt-fm1/ · Created at Polaris Sound Lab, Mérida, Yucatán, México."
          gh release upload $T install/DarkFunkDurcal-1.8.2-dfd6.fwsc install/DarkFunkDurcal-Installer.html manual/DarkFunkDurcal-Manual-EN-ES.pdf manual/DarkFunkDurcal-Manual-ES.pdf --clobber
